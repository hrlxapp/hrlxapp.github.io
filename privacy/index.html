<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0B0D">
  <title>Privacy — HRLX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#0A0B0D;color:#F2F2F0;
      font-family:'Tajawal',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{width:min(860px,calc(100% - 40px));margin:auto;padding:32px 0 80px}
    .top{
      min-height:70px;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08)
    }
    .brand{font-weight:800;letter-spacing:.04em;text-decoration:none;color:#F2F2F0}
    .card{
      margin-top:70px;padding:34px;border:1px solid rgba(255,255,255,.08);
      background:#131418;border-radius:22px;
    }
    h1{font-size:40px;margin:0 0 14px}
    p{color:#9A9B9F;line-height:1.9;font-size:17px;margin:0}
    .back{
      display:inline-flex;margin-top:28px;padding:12px 18px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12);color:#F2F2F0;text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="../">HRLX</a>
    </div>
    <main class="card">
      <h1>سياسة الخصوصية</h1>
      <p>هذه الصفحة مخصّصة لسياسة الخصوصية الرسمية لـ HRLX. سنضع النص النهائي المعتمد هنا لاحقًا.</p>
      <a class="back" href="../">العودة إلى HRLX</a>
    </main>
  </div>
</body>
</html>
